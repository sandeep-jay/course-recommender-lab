[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-recommender-lab"
version = "0.1.0"
description = "A sandbox for learning content-based recommender systems on the UC Berkeley course catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Jayaprakash" }]
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==17.0.0",
    "scikit-learn==1.6.1",
    "scipy==1.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "black==24.10.0",
]
# Phase 3 — semantic vectors. Heavy (torch ~hundreds of MB), so kept out of the
# base install: Phases 0–2 run without it. Enable with `pip install -e ".[semantic]"`.
# The recommenders degrade gracefully (skip + note) when this extra is absent.
semantic = [
    "sentence-transformers==5.5.1",
    "torch==2.12.0",
    "faiss-cpu==1.14.2",
]
# Phase 6 — clustering map. matplotlib draws the 2-D embedding plot; umap-learn is
# the preferred projector but optional (cluster.py falls back to scikit-learn's
# t-SNE when it is absent, so the diagnostic runs on matplotlib alone). KMeans /
# agglomerative / HDBSCAN all come from scikit-learn in the base install.
viz = [
    "matplotlib==3.11.0",
    "umap-learn==0.5.7",
]
# Phase 8 — minimal Streamlit UI (app/streamlit_app.py). Kept out of the base
# install; the library and `scripts/run_eval.py` never import it. The UI surfaces
# the semantic rungs, so pair it with the `semantic` extra:
# `pip install -e ".[ui,semantic]"`.
ui = [
    "streamlit==1.41.1",
]
# Notebooks — the step-by-step teaching breakdowns under notebooks/ (ADR-0014).
# Each notebook reimplements a technique from primitives for teaching, reusing the
# library only for plumbing (data load + the eval harness). jupytext keeps the
# `.py` percent script the versioned source (clean diffs); the `.ipynb` is
# generated and gitignored; nbmake executes it so a notebook can't silently rot.
# Pair with `semantic` for the embedding/rerank/LLM notebooks:
# `pip install -e ".[notebooks,semantic]"`.
notebooks = [
    "jupytext==1.19.3",
    "nbmake==1.5.5",
    "nbclient==0.11.0",
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
    "matplotlib==3.11.0",
]
# Docs site — MkDocs Material published to GitHub Pages (ADR-0015). mkdocs-jupyter
# renders the teaching notebooks as notebook pages; the site ships pre-executed
# .ipynb under docs/notebooks/ so the build never runs a notebook. Mirror any change
# here in requirements-docs.txt (the CI docs build installs from that file).
# Enable with `pip install -e ".[docs]"`.
docs = [
    "mkdocs-material==9.5.49",
    "mkdocs-jupyter==0.25.1",
    "pymdown-extensions==10.14",
    # Pygments 2.19+ breaks pymdown-extensions 10.14's highlighter (`filename=None`);
    # it is a transitive dep, so cap it explicitly. Keep in sync with requirements-docs.txt.
    "Pygments<2.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.jupytext]
# The `.py` percent scripts under notebooks/ are the versioned source; strip the
# noisy notebook/cell metadata so generated .ipynb round-trips stay diff-clean.
notebook_metadata_filter = "-all"
cell_metadata_filter = "-all"

[tool.black]
line-length = 88
target-version = ["py311"]
# The numbered notebook scripts are jupytext teaching breakdowns, not library code
# (mid-file imports, display expressions); nbtools.py *is* linted/formatted.
extend-exclude = "notebooks/[0-9].*\\.py$"

[tool.ruff]
line-length = 88
target-version = "py311"
# Skip the jupytext teaching scripts and the executed notebook render copies under
# docs/notebooks/ (build artifacts of `make docs-notebooks`, not hand-authored source).
extend-exclude = ["notebooks/[0-9]*.py", "docs/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]  # incompatible docstring conventions; keep D211/D212

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Put the repo root on sys.path so the root-level `app` package (the Phase 8 UI)
# is importable in tests; `courserec` resolves via the editable install.
pythonpath = ["."]
