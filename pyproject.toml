[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "course-rec-lab"
version = "0.1.0"
description = "A sandbox for learning content-based recommender systems on the UC Berkeley course catalog."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sandeep Jayaprakash" }]
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "pyarrow==17.0.0",
    "scikit-learn==1.6.1",
    "scipy==1.15.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.8.4",
    "black==24.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]  # incompatible docstring conventions; keep D211/D212

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
