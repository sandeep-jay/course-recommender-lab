# mkdocs.yml — course-recommender-lab documentation site
# Serve:  mkdocs serve   ·   Build: mkdocs build --strict   ·   Deploy: .github/workflows/docs.yml
# Install the toolchain with:  pip install -e ".[docs]"   (or: pip install -r requirements-docs.txt)

site_name: course-recommender-lab
site_description: >-
  A sandbox for learning content-based recommender systems on the UC Berkeley
  course catalog (~11k courses) — one interface, one shared evaluation harness,
  and a leaderboard across lexical, topic, SBERT, rerank, graph, and LLM techniques.
site_author: Sandeep Jayaprakash
site_url: https://sandeep-jay.github.io/course-recommender-lab/

repo_url: https://github.com/sandeep-jay/course-recommender-lab
repo_name: sandeep-jay/course-recommender-lab
edit_uri: edit/main/docs/

docs_dir: docs

# Fail the build on broken internal links / nav issues. Source-file references are
# GitHub blob URLs (resolved outside the site), so the strict build stays green.
strict: true

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.details
  # snippets lets docs/changelog.md include the repo-root CHANGELOG.md verbatim
  # (single source of truth — the site changelog can never drift from the file).
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # SuperFences registers the mermaid custom fence so ```mermaid renders client-side.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  # Renders the teaching notebooks as notebook pages. The site ships *pre-executed*
  # .ipynb committed under docs/notebooks/ (built by scripts/render_notebooks.py where
  # the catalog + Ollama exist), so execute stays false — the build only renders,
  # never runs a notebook. Only .ipynb under docs/ is processed; the versioned
  # notebooks/*.py source lives outside docs_dir and is untouched (ADR-0015).
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["*.ipynb"]
      ignore: ["*.py"]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sandeep-jay/course-recommender-lab
      name: Source on GitHub

nav:
  - Home: index.md
  - Reviewer Guide: reviewer-guide.md
  - The Data: data.md
  - Architecture: ARCHITECTURE.md
  - Results:
      - Results & Findings: RESULTS.md
      - Technique Tradeoffs: TRADEOFFS.md
  - Teaching Notebooks:
      - Overview: notebooks/index.md
      - 00 · Data & Eval foundation: notebooks/00_data_and_eval.ipynb
      - 01 · Lexical (TF-IDF, BM25): notebooks/01_lexical.ipynb
      - 02 · Topic models (LSA, NMF, LDA): notebooks/02_topics.ipynb
      - 03 · Semantic vectors (SBERT): notebooks/03_embeddings.ipynb
      - 04 · Retrieve → rerank → MMR: notebooks/04_rerank.ipynb
      - 05 · Metadata fusion: notebooks/05_metadata.ipynb
      - 06 · Course graph (PPR): notebooks/06_graph.ipynb
      - 07 · Clustering & 2-D map: notebooks/07_clustering.ipynb
      - 08 · LLM enrichment & rerank: notebooks/08_llm.ipynb
      - 09 · Leaderboard synthesis: notebooks/09_leaderboard.ipynb
  - Case Study: case-study.md
  - Operations (Runbook): RUNBOOK.md
  - Decisions (ADRs):
      - Index: adr/README.md
      - 0001 · Duplicate course IDs: adr/0001-duplicate-course-ids.md
      - 0002 · Eval harness design: adr/0002-eval-harness-design.md
      - 0003 · Judged-query lens: adr/0003-judged-query-lens.md
      - 0004 · Semantic vectors: adr/0004-semantic-vectors.md
      - 0005 · Rerank + MMR: adr/0005-rerank-mmr.md
      - 0006 · Graph held-out split: adr/0006-graph-heldout.md
      - 0007 · Clustering as diagnostic: adr/0007-clustering-diagnostic.md
      - 0008 · Metadata fusion: adr/0008-metadata-fusion.md
      - 0009 · LLM enrichment (Ollama): adr/0009-llm-enrichment-ollama.md
      - 0010 · LLM reranker: adr/0010-llm-reranker.md
      - 0011 · LLM explainer: adr/0011-llm-explainer.md
      - 0012 · Streamlit UI: adr/0012-streamlit-ui.md
      - 0013 · Warm Docker image: adr/0013-deploy-warm-docker-image.md
      - 0014 · Teaching notebooks: adr/0014-teaching-notebooks.md
      - 0015 · Docs site + rendered notebooks: adr/0015-docs-site.md
  - Roadmap: roadmap/recommender_plan.md
  - Changelog: changelog.md
  - About: about.md
